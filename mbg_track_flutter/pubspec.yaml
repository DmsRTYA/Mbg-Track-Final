name: mbg_track
description: MBG-Track - Sistem Informasi Manajemen Rantai Pasokan Program Makan Bergizi Gratis
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  image_picker: ^1.0.4
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_local_notifications: ^17.2.3
  web_socket_channel: ^3.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo-bgn.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo-bgn.png
